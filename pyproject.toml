[project]
name = "back-shkaf"
version = "0.1.0"
description = "Проект по созданию платформы обмена вещами и вторичного использования «Добрый Шкаф» в рамках Проектного Практикума УрФУ"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "channels>=4.2",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "django==5.2.18",
    "django-cors-headers>=4.6",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "pillow>=11",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.2",
]
